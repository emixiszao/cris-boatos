<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dia</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .fundo { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vh;
           background:radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,.82) 100%);
           opacity:0; }
  .fundo.ativo { animation:cena 10s ease both; }
  .dia { margin:0; font-family:Georgia,"Times New Roman",serif; font-weight:900; font-size:clamp(64px,15vw,170px); line-height:1; letter-spacing:.02em;
         color:#d98a35; transform:perspective(700px) rotateX(14deg); transform-origin:center bottom;
         text-shadow:0 1px 0 #b8701f, 0 2px 0 #a3631b, 0 3px 0 #8f5718, 0 4px 0 #7a4b14, 0 5px 0 #653f11,
                     0 6px 0 #51330e, 0 7px 0 #3d270a, 0 12px 14px rgba(0,0,0,.85), 0 24px 40px rgba(0,0,0,.6);
         }
  .ativo .dia { animation:entra 1.2s cubic-bezier(.2,.8,.2,1) both; }
  .boatos { display:flex; align-items:center; gap:2vw; color:#fff; font-size:clamp(20px,3.2vw,38px); font-weight:700; letter-spacing:.04em;
            text-shadow:0 2px 6px rgba(0,0,0,.9); }
  .barra { width:clamp(160px,22vw,300px); height:clamp(12px,1.6vw,20px); border-radius:999px; background:#2a2a2a; position:relative; overflow:hidden;
           box-shadow:0 0 0 2px rgba(255,255,255,.12), 0 4px 10px rgba(0,0,0,.7); }
  .barra i { position:absolute; inset:0; background:linear-gradient(90deg,#2ecc71 0%,#f1c40f 38%,#f39c12 66%,#e74c3c 100%);
             clip-path:inset(0 100% 0 0); transition:clip-path 1.2s .6s ease; }
  @keyframes cena  { 0% { opacity:0; } 8% { opacity:1; } 92% { opacity:1; } 100% { opacity:0; } }
  @keyframes entra { from { opacity:0; transform:perspective(700px) rotateX(14deg) translateY(30px) scale(.92); } }
  .ativo .boatos { animation:entra2 1.2s .25s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes entra2 { from { opacity:0; transform:translateY(20px); } }
  @media (prefers-reduced-motion:reduce) { .ativo .dia, .ativo .boatos { animation:none; } }
</style>
</head>
<body>
  <div class="fundo">
    <h1 class="dia" id="dia"></h1>
    <div class="boatos">Boatos <div class="barra" role="img" aria-label="Nível de boatos"><i id="fill"></i></div></div>
  </div>

<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";

const DIA_ID = "com.cris.boatos/dia";
const ATRASO_MS = 700;   // atraso da imagem em relação ao som (aumente se o som ainda chegar antes)
const p = new URLSearchParams(location.search);
const dia = Math.max(1, parseInt(p.get("dia"), 10) || 1);
const boatos = Math.min(5, Math.max(0, parseInt(p.get("boatos"), 10) || 0));

document.getElementById("dia").textContent = `${dia}º Dia`;

// boatos 0 a 2 -> dia1.mp3 | boatos 3 a 5 -> dia2.mp3
const som = new Audio(boatos >= 3 ? "dia2.mp3" : "dia1.mp3");
function mostrar() {
  setTimeout(() => {
    document.querySelector(".fundo").classList.add("ativo");
    document.getElementById("fill").style.clipPath = `inset(0 ${100 - (boatos / 5) * 100}% 0 0)`;
    OBR.onReady(() => setTimeout(() => OBR.modal.close(DIA_ID), 10000));
  }, ATRASO_MS);
}
som.play().then(mostrar, mostrar);
</script>
</body>
</html>
