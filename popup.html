<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aviso de boatos</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:transparent; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { padding:6px; }
  .aviso { height:100%; display:flex; align-items:center; gap:14px; padding:10px 18px 10px 14px; border-radius:12px;
           background:linear-gradient(160deg,#1f1f1f,#0a0a0a); border:2px solid var(--cor);
           box-shadow:0 0 16px rgba(0,0,0,.85); animation:vida 7s ease forwards; }
  svg { width:52px; height:52px; flex:none; }
  .texto { min-width:0; }
  h1 { margin:0; font-size:17px; letter-spacing:.06em; color:#fff; }
  p  { margin:3px 0 0; font-size:13px; color:#c9c4d6; line-height:1.25; }
  @keyframes vida {
    0%   { opacity:0; transform:translateX(30px); }
    6%   { opacity:1; transform:none; }
    92%  { opacity:1; transform:none; }
    100% { opacity:0; transform:translateX(30px); }
  }
</style>
</head>
<body>
  <div class="aviso" id="aviso">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M10 10h44a6 6 0 0 1 6 6v26a6 6 0 0 1-6 6H30L16 60V48h-6a6 6 0 0 1-6-6V16a6 6 0 0 1 6-6z" fill="var(--cor)"/>
      <circle cx="22" cy="29" r="3.2" fill="#fff"/><circle cx="32" cy="29" r="3.2" fill="#fff"/><circle cx="42" cy="29" r="3.2" fill="#fff"/>
    </svg>
    <div class="texto"><h1 id="titulo"></h1><p id="sub"></p></div>
  </div>

<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";

const POPUP_ID = "com.cris.boatos/popup";
const tipo = new URLSearchParams(location.search).get("tipo") === "desce" ? "desce" : "sobe";
const TEXTOS = {
  sobe:  { cor: "#e0414b", titulo: "OS BOATOS SE ESPALHAM", sub: "A desconfiança cresce em Santa Misericórdia." },
  desce: { cor: "#3fbf6a", titulo: "OS BOATOS SE DISSIPAM", sub: "A tranquilidade retorna aos poucos." }
}[tipo];

document.documentElement.style.setProperty("--cor", TEXTOS.cor);
document.getElementById("titulo").textContent = TEXTOS.titulo;
document.getElementById("sub").textContent = TEXTOS.sub;

const som = new Audio("boato.mp3");
som.play().catch(() => {});

OBR.onReady(() => setTimeout(() => OBR.popover.close(POPUP_ID), 7000));
</script>
</body>
</html>
